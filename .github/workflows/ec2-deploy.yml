name: Deploy to EC2

on:
  push:
    branches:
      - master  # master 브랜치에 push되면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to EC2 via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: target/finalproject.war
          target: /home/ubuntu/

      - name: SSH and Restart Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            /home/ubuntu/tomcat9/bin/shutdown.sh || true
            rm -rf /home/ubuntu/tomcat9/webapps/ROOT
            cp /home/ubuntu/finalproject.war /home/ubuntu/tomcat9/webapps/ROOT.war
            /home/ubuntu/tomcat9/bin/startup.sh
