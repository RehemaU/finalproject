name: Deploy to EC2 with git pull and build

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code (for caching etc.)
        uses: actions/checkout@v4

      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/finalproject
            git pull origin master
            sleep 5

            # 톰캣 프로세스 확인 및 종료 시도
            PID=$(pgrep -f tomcat)
            if [ -n "$PID" ]; then
              echo "톰캣 종료 시도 (PID: $PID)"
              sudo /home/ubuntu/tomcat9/bin/shutdown.sh || true
              sleep 5

              PID=$(pgrep -f tomcat)
              if [ -n "$PID" ]; then
                echo "톰캣 강제 종료 (PID: $PID)"
                sudo pkill -f tomcat || true
                sleep 5
              fi
            else
              echo "톰캣 프로세스 없음, 종료 불필요"
            fi

            sudo rm -rf /home/ubuntu/tomcat9/webapps/ROOT
            sudo rm -f /home/ubuntu/tomcat9/webapps/ROOT.war
            sleep 5

            mvn clean package -DskipTests
            sleep 5

            sudo cp /home/ubuntu/finalproject/target/web.war /home/ubuntu/tomcat9/webapps/ROOT.war
            sleep 5

            sudo /home/ubuntu/tomcat9/bin/startup.sh
            echo "배포 완료"
