name: Deploy to EC2 with git pull and build

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code (for caching etc.)
        uses: actions/checkout@v4

      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            # EC2 프로젝트 디렉터리로 이동
            cd /home/ubuntu/finalproject


            # 최신 master 브랜치 pull
            git pull origin master

            # 톰캣 종료 및 프로세스 강제 종료 (오류 무시)
            sudo /home/ubuntu/tomcat9/bin/shutdown.sh || true
            sleep 10  
            sudo pkill -f tomcat || true  # 만약 종료가 안 됐으면 강제 종료


            # 기존 배포물 제거
            sudo rm -rf /home/ubuntu/tomcat9/webapps/ROOT
            sudo rm -f /home/ubuntu/tomcat9/webapps/ROOT.war

            # Maven 빌드 (테스트 제외)
            mvn clean package -DskipTests

            # 빌드 결과 WAR 복사
            sudo cp /home/ubuntu/finalproject/target/web.war /home/ubuntu/tomcat9/webapps/ROOT.war

            # 톰캣 시작
            sudo /home/ubuntu/tomcat9/bin/startup.sh
